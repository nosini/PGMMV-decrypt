name: Build

# Decoder tests run on every push and pull request. The full player build
# runs for version tags, which also publish a release, and
# on demand from the Actions tab. Both use Debian 12: the player is built on
# that older glibc and bundles its other libraries, so it runs on current
# distributions in general.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Decoder tests
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config nettle-dev git ca-certificates
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure

  player:
    name: Player
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: debian:12
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      # CMake includes precompiled headers with -include, as ccache requires.
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
        with:
          path: decrypt
      - name: Read the player commit the patches apply to
        id: base
        run: echo "commit=$(cat decrypt/patches/base-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: nosini/PGMMV
          ref: ${{ steps.base.outputs.commit }}
          path: pgmmv
      - name: Install build dependencies
        run: apt-get install -y --no-install-recommends $(grep -v '^#' decrypt/ci/dependencies.txt)
      - name: Cache compiler results
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Cache entries are immutable; each run saves its accumulated results.
          key: ${{ runner.os }}-debian12-player-ccache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-debian12-player-ccache-v1-
      - name: Reset cache statistics
        run: ccache --zero-stats
      - name: Build GLFW
        run: sh decrypt/ci/build-glfw.sh
      - name: Build, test and pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=dev-$(echo "$GITHUB_SHA" | cut -c1-7)
          fi
          sh decrypt/ci/build-player.sh decrypt pgmmv dist "$version"
      - name: Show cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: player
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: player
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: player
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- dist/*.tar.gz
          if [ ! -f "$1" ]; then
            echo "No player tarballs were downloaded; refusing to publish a release." >&2
            exit 1
          fi
          # Tags with a suffix such as v1.0-rc1 are prereleases.
          case "$TAG" in
            *-*) prerelease="--prerelease --latest=false" ;;
            *) prerelease="" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$prerelease" ]; then gh release edit "$TAG" $prerelease; fi
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --verify-tag --generate-notes $prerelease
          fi
          # Recover drafts left by an interrupted create/upload/publish sequence.
          gh release edit "$TAG" --draft=false
